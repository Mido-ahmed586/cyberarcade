services:
  kali:
    build: .
    container_name: cyber_kali_msf
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      - cyberarcade-lab-net
    ports:
      - "2221:22"

  metasploitable2:
    image: lvanhaaren/metasploitable2:1.0
    container_name: metasploitable2
    tty: true
    stdin_open: true
    networks:
      - cyberarcade-lab-net

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    networks:
      - cyberarcade-lab-net

  guacamole-db:
    image: postgres:15-alpine
    container_name: guacamole-db
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: guacamole_pass
    volumes:
      - guac-db-data:/var/lib/postgresql/data
      - ./guac-initdb:/docker-entrypoint-initdb.d
    networks:
      - cyberarcade-lab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  guacamole:
    image: guacamole/guacamole
    container_name: guacamole
    depends_on:
      guacamole-db:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD: guacamole_pass
      POSTGRESQL_HOSTNAME: guacamole-db
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
    ports:
      - "8080:8080"
    networks:
      - cyberarcade-lab-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/guacamole/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  cyberarcade-lab-net:
    driver: bridge

volumes:
  guac-db-data:
    driver: local

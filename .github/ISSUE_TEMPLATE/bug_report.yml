name: Bug Report
description: Report a reproducible bug in CyberArcade
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: ["Mido-ahmed586"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out the form below as completely as possible to help us reproduce and fix the issue quickly.

        **Security vulnerabilities must not be reported here.** See [SECURITY.md](../SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Platform Version
      description: Git commit hash or release tag
      placeholder: "e.g. v1.0.0 or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      multiple: false
      options:
        - Frontend (React)
        - Backend API (FastAPI)
        - Authentication / JWT
        - Lab Orchestration (Docker)
        - Lab Terminal (Guacamole)
        - AI Coach
        - Database / Migrations
        - Seed / Initial Data
        - CI / Workflows
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to consistently reproduce the bug.
      value: |
        1. Start the platform with `docker compose up -d`
        2. Navigate to ...
        3. Click / run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: Describe what should happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      placeholder: Describe what actually happens.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any error messages, stack traces, or Docker logs.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Docker version:
        - Docker Compose version:
        - Browser (if frontend issue):
        - Node.js version (if applicable):
        - Python version (if applicable):
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have included all required information above
          required: true
        - label: This is not a security vulnerability (see SECURITY.md)
          required: true

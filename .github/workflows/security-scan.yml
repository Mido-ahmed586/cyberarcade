name: Security Scan

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  bandit:
    name: Python — Bandit SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Backend/cyberarcade-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install "bandit[toml]"
      - name: Run Bandit
        run: |
          bandit -r app/ --severity-level medium --confidence-level medium --format txt || true

  trivy-fs:
    name: Trivy — Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  trivy-docker:
    name: Trivy — Docker Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image for scanning
        run: docker build -t cyberarcade-backend:scan ./Backend/Backend/cyberarcade-backend
      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: cyberarcade-backend:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

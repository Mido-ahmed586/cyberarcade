name: Security Scan

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  bandit:
    name: Python — Bandit SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Backend/cyberarcade-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -r app/ \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit-results.sarif \
            --exclude app/tests/ || true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend/cyberarcade-backend/bandit-results.sarif
          category: bandit

  # ─────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: Trivy — Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

  # ─────────────────────────────────────────────────────────────────────
  trivy-docker:
    name: Trivy — Docker Image Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image for scanning
        run: docker build -t cyberarcade-backend:scan ./Backend/Backend/cyberarcade-backend

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: cyberarcade-backend:scan
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-docker

name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - "**/requirements*.txt"
      - "**/package*.json"
      - "**/pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "**/requirements*.txt"
      - "**/package*.json"
      - "**/pyproject.toml"
  schedule:
    # Run every Wednesday at 09:00 UTC
    - cron: "0 9 * * 3"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  python-audit:
    name: Python — Safety + pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cyberarcade-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tools
        run: pip install pip-audit safety

      - name: pip-audit
        run: pip-audit -r requirements.txt --format=json --output=pip-audit.json || true

      - name: Safety check
        run: safety check -r requirements.txt --json > safety-report.json || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-audit-reports
          path: |
            backend/cyberarcade-backend/pip-audit.json
            backend/cyberarcade-backend/safety-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  npm-audit:
    name: Node.js — npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/cyberarcade

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/cyberarcade/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/cyberarcade/npm-audit.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  dependabot-check:
    name: Summarise Audit Results
    runs-on: ubuntu-latest
    needs: [python-audit, npm-audit]
    if: always()

    steps:
      - name: Audit summary
        run: |
          echo "Dependency audit completed."
          echo "Review uploaded artifacts for detailed vulnerability reports."
          echo "Python: ${{ needs.python-audit.result }}"
          echo "Node.js: ${{ needs.npm-audit.result }}"

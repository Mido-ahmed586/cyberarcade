name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Backend/cyberarcade-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt flake8 black isort mypy

      - name: flake8
        run: flake8 app/ --max-line-length=100 --exclude=alembic/

      - name: black (format check)
        run: black app/ --check --line-length=100

      - name: isort (import order)
        run: isort app/ --check-only --profile=black

  # ─────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Validation
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cyberarcade_test
          POSTGRES_USER: cyberarcade
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/cyberarcade-backend

    env:
      DATABASE_URL: postgresql+asyncpg://cyberarcade:testpassword@localhost:5432/cyberarcade_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx

      - name: Validate Python syntax
        run: python -m compileall -q app


  # ─────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/Frontend/cyberarcade

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/Frontend/cyberarcade/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check / lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/Frontend/cyberarcade/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: Backend/Backend/cyberarcade-backend
          push: false
          tags: cyberarcade-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: Frontend/Frontend/cyberarcade
          push: false
          tags: cyberarcade-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────
  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ||
                "${{ needs.frontend-build.result }}" != "success" ||
                "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All CI checks passed."

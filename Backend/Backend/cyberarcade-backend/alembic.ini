# Alembic configuration for CyberArcade backend
# Run migrations with:  alembic upgrade head
# Create a migration with: alembic revision --autogenerate -m "describe change"

[alembic]
script_location = alembic
prepend_sys_path = .

# The database URL is read from the environment variable DATABASE_URL via
# alembic/env.py — this placeholder keeps alembic happy for offline mode.
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
